<title>Jedhrec</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="css">
/* Layout: barra superior + mazos a la izquierda + vista previa fija de la carta + grupos por tipo en columnas (lista) o cuadrícula de imágenes */
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #1b2430; --muted: #5d6b7c; --line: #d5dce4; --hover: #e6edf3;
  --accent: #1f6f8b; --accent-ink: #ffffff; --accent-soft: #dcecf2;
  --foil: #a8741a; --foil-soft: #f6ead2; --danger: #b3261e; --danger-soft: #f8dedc; --ok: #2e7d4f;
  --mW: #f6f1d0; --mU: #b3d4ea; --mB: #b9b0ab; --mR: #ec9f82; --mG: #9fc79a; --mC: #d3cdcb; --m-ink: #1b1b1b;
  --f-display: "Alegreya SC", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171d; --panel: #1a2129; --ink: #e3e9ef; --muted: #93a1b1; --line: #2c3743; --hover: #222b35;
  --accent: #5fb3d0; --accent-ink: #0b1a21; --accent-soft: #1d3542;
  --foil: #e0b45e; --foil-soft: #3a2f1a; --danger: #f08a80; --danger-soft: #3d1f1d; --ok: #74c69a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171d; --panel: #1a2129; --ink: #e3e9ef; --muted: #93a1b1; --line: #2c3743; --hover: #222b35;
  --accent: #5fb3d0; --accent-ink: #0b1a21; --accent-soft: #1d3542;
  --foil: #e0b45e; --foil-soft: #3a2f1a; --danger: #f08a80; --danger-soft: #3d1f1d; --ok: #74c69a; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 0.86em; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; letter-spacing: 0.02em; margin: 0; white-space: nowrap; }
.brand button { border: 0; background: transparent; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; cursor: pointer; }
.brand button:hover { color: var(--accent); }
.homehead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.homehead.next { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
.homehead h2 { margin: 0; font-family: var(--f-display); font-size: 1.6rem; }
.homehead .hsort { margin-left: auto; align-self: center; }
.homehead .dd .menu { left: auto; right: 0; min-width: 220px; }
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 12px; }
.dcard { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: start; text-align: left; font: inherit; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.dcard:hover { border-color: var(--accent); }
.dcard .thumbs { display: grid; gap: 4px; }
.dcard .thumbs .art { box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
.dcard .info { display: grid; gap: 3px; min-width: 0; }
.dcard h3 { margin: 0; font-family: var(--f-display); font-size: 1.25rem; line-height: 1.15; }
.dcard .cmdr { font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dcard .cmdr small { color: var(--muted); font-size: 0.85rem; }
.search { flex: 1 1 220px; min-width: 0; max-width: 520px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.search input { flex: 1 1 180px; min-width: 0; width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--danger); }
.wipe { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.wipe p { margin: 2px 0 0; }
.wipe .btn { display: inline-flex; align-items: center; gap: 6px; }
.btn.danger.solid { background: var(--danger); color: var(--panel); border-color: var(--danger); }
.btn:disabled { opacity: 0.5; cursor: default; }
.status { font-size: 0.85rem; color: var(--muted); }
.status.dirty { color: var(--foil); font-weight: 700; }

.layout { padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.decknav { flex-basis: 100%; display: flex; align-items: center; gap: 8px 16px; min-width: 0; border-top: 1px solid var(--line); padding-top: 8px; }
.deckmenu { position: relative; flex: 0 1 auto; min-width: 0; max-width: 480px; }
.deckacts { display: flex; gap: 6px; margin-left: -8px; }
.mtot { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 10px; }
.dmbtn { display: inline-flex; align-items: center; gap: 9px; max-width: 100%; border: 1px solid var(--line); background: var(--bg);
  border-radius: 6px; padding: 5px 12px; }
.dmbtn:hover, .dmbtn[aria-expanded="true"] { border-color: var(--accent); }
.dmbtn .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.dmbtn b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dmbtn .caret { color: var(--muted); font-size: 0.8rem; }
.mega { position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: min(940px, calc(100vw - 32px)); max-height: 75vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
  padding: 16px 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 28px; }
.mega h3 { font-family: var(--f-display); font-size: 1.1rem; margin: 0 0 6px; }
.mcol { display: grid; gap: 2px; align-content: start; }
/* Card lists span the whole menu, with their items flowing across in columns. */
.mcol.wide { grid-column: 1 / -1; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); column-gap: 28px; }
.mcol.wide h3 { grid-column: 1 / -1; }

.mitem { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 5px 6px; border-radius: 6px; text-align: left; }
.mitem:hover { background: var(--hover); }
.mitem.on { background: var(--accent-soft); }
.mitem.on b { color: var(--accent); }
.mitem span { display: grid; min-width: 0; line-height: 1.25; }
.mitem .pips { display: inline-flex; }
.mitem b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mitem small { color: var(--muted); font-size: 0.76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mega .empty { grid-column: 1 / -1; padding: 8px; }
.pips { display: inline-flex; gap: 2px; flex: none; }
.pip { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-family: var(--f-mono); font-size: 10px; font-weight: 700;
  color: var(--m-ink); background: var(--mC); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
img.sym { background: none; box-shadow: none; border-radius: 0; display: inline-block; vertical-align: middle; }
img.ms.sym { width: 17px; height: 17px; }
img.pip.sym { width: 19px; height: 19px; }
.pip.W { background: var(--mW); } .pip.U { background: var(--mU); } .pip.B { background: var(--mB); } .pip.R { background: var(--mR); } .pip.G { background: var(--mG); }
.totals { flex: none; font-size: 0.8rem; color: var(--muted); display: flex; gap: 14px; }
.totals div { display: flex; gap: 5px; }

.view { min-width: 0; display: grid; gap: 14px; }
.deckhead { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
.deckname { font-family: var(--f-display); font-size: 1.8rem; font-weight: 700; margin: 0; text-wrap: balance; }
.cmdr { color: var(--muted); }
.cmdr b { color: var(--ink); font-weight: 500; }
.headgrid { display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: end; justify-content: space-between; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.stat { display: grid; }
.stat small, .curve small { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.stat strong { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 1.15rem; }
.curve { display: grid; gap: 4px; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 88px; }
.bar { width: 22px; display: grid; justify-items: center; align-content: end; gap: 2px; height: 100%; }
.bar i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.bar em { font-style: normal; font-size: 0.75rem; color: var(--muted); font-family: var(--f-mono); }
.bar b { font-size: 0.75rem; font-family: var(--f-mono); font-weight: 400; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
.pill.ok { background: var(--accent-soft); color: var(--ok); }
.pill.warn { background: var(--danger-soft); color: var(--danger); }
.pill.info { background: var(--line); color: var(--muted); }
.deckhead.compact { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 14px; }
.cmdthumbs { display: flex; gap: 4px; flex: none; }
.cmdthumb { width: 84px; border: 0; padding: 0; background: transparent; border-radius: 4px; display: block; }
.cmdthumb .art { box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
.cmdthumb.none { aspect-ratio: 488 / 680; display: grid; place-items: center; border: 1px dashed var(--line); color: var(--muted); font-size: 1.4rem; }
/* Two commanders (partners): the second sits behind the first, peeking out top right; hovering brings it to the front. */
.stack { position: relative; display: block; padding-top: 12px; }
.cmdthumbs.stack { width: 96px; }
.stack > * { position: relative; z-index: 2; width: calc(100% - 12px); transition: transform .2s ease, filter .2s ease; }
.stack > :last-child { position: absolute; top: 0; left: 12px; z-index: 1; filter: brightness(0.8); }
.stack:hover > :first-child { z-index: 1; transform: translate(12px, -12px); filter: brightness(0.8); }
.stack:hover > :last-child { z-index: 3; transform: translate(-12px, 12px); filter: none; }
.dh-main { flex: 1 1 260px; min-width: 0; display: grid; gap: 2px; }
.compact .titlerow { gap: 4px 10px; align-items: center; }
.compact .deckname { font-size: 1.45rem; line-height: 1.15; }
.compact .cmdr { font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.statline { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 0.85rem; color: var(--muted); }
.statline b { color: var(--ink); font-weight: 600; }
.compact .bars { height: 88px; gap: 4px; }
.compact .bar { width: 24px; }
.dh-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.statline.types { margin-top: 2px; }
.more { position: relative; }
.more summary { list-style: none; padding: 6px 12px; font-weight: 700; line-height: 1.2; }
.more summary::-webkit-details-marker { display: none; }
.more .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); display: grid; min-width: 170px; padding: 4px; }
.more .menu button { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 5px; }
.more .menu button:hover { background: var(--hover); }
.more .menu button.danger { color: var(--danger); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.deckhead .toolbar { flex: 1 1 100%; gap: 8px 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.deckhead .toolbar #deckFilter { flex: 0 1 300px; }
.pricef { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.deckhead .toolbar .tright { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-left: auto; }
.tright .dd .menu { left: auto; right: 0; }
.pricef.on { color: var(--accent); }
.toolbar .pricef input { flex: 0 0 64px; width: 64px; }
.pricef .linkbtn { font-size: 1.1rem; line-height: 1; padding: 0 4px; }
.toolbar input { flex: 1 1 160px; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 11px; font-size: 0.9rem; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ic.chev { width: 14px; height: 14px; color: var(--muted); }
.ibtn { display: inline-grid; place-items: center; padding-left: 9px; padding-right: 9px; }
.ibtn .ic { width: 18px; height: 18px; }
.ibtn:hover { background: var(--accent); color: var(--accent-ink); }
.ibtn.add { border-color: var(--accent); color: var(--accent); }
.ibtn.add:hover { color: var(--accent-ink); }
.ibtn.danger { border-color: var(--danger); }
.ibtn.danger:hover { background: var(--danger); color: var(--panel); border-color: var(--danger); }
#saveBtn, #backupBtn { display: inline-flex; align-items: center; gap: 6px; }
#themeBtn { display: inline-grid; place-items: center; padding-left: 9px; padding-right: 9px; }
#themeBtn .ic { width: 18px; height: 18px; }
.dd summary { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.dd summary > .ic:first-child { color: var(--accent); }
.dd .menu button { display: flex; align-items: center; gap: 8px; }
.dd .ddk { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.dd .menu { left: 0; right: auto; min-width: 150px; }
.dd .menu button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

.addform { display: grid; grid-template-columns: 90px minmax(0, 1fr) 110px; gap: 12px; }
.addform label { display: grid; gap: 4px; font-size: 0.82rem; color: var(--muted); }
.addform input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; width: 100%; color: var(--ink); font-size: 0.95rem; }
.addform .f-n { grid-column: 2 / 4; }
.addform .f-s { grid-column: 1 / 4; }
.addform p.f-s { margin: -6px 0 0; }
.addform .f-e { grid-column: 1 / 3; }
.addform .f-f { display: flex; align-items: center; gap: 6px; color: var(--ink); font-size: 0.95rem; grid-column: 1 / 4; }
.addform .f-f input { width: auto; }
.addform .row2 { grid-column: 1 / 4; }
.addform .addcsv { display: grid; gap: 4px; justify-items: start; padding-top: 12px; border-top: 1px solid var(--line); }

.board { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
.board.nopreview { grid-template-columns: minmax(0, 1fr); }
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 120px) + 12px); display: grid; gap: 8px; }
.preview .art { width: 100%; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
.preview .pname { font-weight: 700; }
.preview .pmeta { font-size: 0.85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }

.art { display: block; width: 100%; max-width: 100%; aspect-ratio: 488 / 680; border-radius: 4.6% / 3.4%; background-color: var(--line);
  background-repeat: no-repeat; object-fit: cover; overflow: hidden; }
.art.ph { display: grid; align-content: center; justify-items: center; gap: 6px; padding: 10%; text-align: center; color: var(--muted);
  background: linear-gradient(160deg, var(--panel), var(--hover)); border: 1px solid var(--line); font-size: 0.85rem; }
.art.ph b { color: var(--ink); font-size: 0.95rem; }

.groups { columns: 300px; column-gap: 28px; }
.group { break-inside: avoid; margin-bottom: 18px; display: block; }
.ghead { display: flex; align-items: baseline; gap: 6px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent;
  padding: 4px 2px 6px; text-align: left; font-weight: 700; font-size: 1rem; }
.ghead .num { color: var(--muted); font-weight: 400; }
.ghead .caret { margin-left: auto; color: var(--muted); font-size: 0.8rem; }
.ghead .gval { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
.okbtn { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  color: var(--muted); cursor: pointer; opacity: 0.55; }
.okbtn .ic { width: 13px; height: 13px; stroke-width: 3; }
.okbtn:hover { opacity: 1; border-color: var(--ok); color: var(--ok); }
.okbtn.on { opacity: 1; background: var(--ok); border-color: var(--ok); color: var(--panel); }
.gcard .okbtn { position: absolute; top: -7px; right: -7px; z-index: 3; width: 28px; height: 28px; opacity: 0.85; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }
.gcard .okbtn .ic { width: 15px; height: 15px; }
#hideOkBtn { display: inline-flex; align-items: center; gap: 6px; }
#hideOkBtn[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); font-weight: 700; }
#hideOkBtn .num { color: var(--muted); font-weight: 400; }
.sizer { text-transform: none; letter-spacing: 0; }
.sizer .ic { width: 15px; height: 15px; }
.sizer input[type="range"] { flex: 0 1 120px; width: 120px; padding: 0; border: 0; background: transparent; accent-color: var(--accent); }
.verifybtn.on { background: var(--ok); border-color: var(--ok); color: var(--panel); font-weight: 700; }
tr.is-ok .linkbtn { color: var(--ok); }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 22px; gap: 8px; align-items: center; padding: 5px 4px;
  border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 4px; }
.row:hover, .row.sel { background: var(--hover); }
.row .q { color: var(--muted); text-align: right; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .foilmark { color: var(--foil); font-size: 0.75rem; font-weight: 700; margin-left: 4px; }

.cost { display: inline-flex; gap: 2px; align-items: center; flex-wrap: nowrap; }
.ms { width: 17px; height: 17px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 700;
  font-family: var(--f-mono); color: var(--m-ink); background: var(--mC); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); line-height: 1; }
.ms.W { background: var(--mW); } .ms.U { background: var(--mU); } .ms.B { background: var(--mB); } .ms.R { background: var(--mR); } .ms.G { background: var(--mG); }

.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--cw, 150px)), 1fr)); gap: 12px; }
.gsec { display: grid; gap: 10px; margin-bottom: 8px; }
.gcard { position: relative; border: 0; padding: 0; background: transparent; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; min-width: 0; }
.gcard:hover .art { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); }
.gcard .art { transition: transform .15s, box-shadow .15s; }
.flip { position: relative; display: block; perspective: 1400px; }
.flip .faces { display: grid; transform-style: preserve-3d; transition: transform .5s; }
.flip .faces > .art { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; }

<script id="main-js">
(function () {
  const DRAFT_KEY = "boveda-mazos-draft-v2";
  const UI_KEY = "boveda-mazos-ui-v2";
  const BACKUP_KEY = "boveda-mazos-lastbackup";     // when all decks were last written to a file
  const FILE_DIRTY_KEY = "boveda-mazos-filedirty";  // changes made since then (local version)
  let fileHandle = null;
  const BASICS = new Set(["Plains", "Island", "Swamp", "Mountain", "Forest", "Wastes", "Snow-Covered Plains", "Snow-Covered Island", "Snow-Covered Swamp", "Snow-Covered Mountain", "Snow-Covered Forest", "Snow-Covered Wastes"]);
  const SPRITE = { cols: 10, rows: 6 };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => "$" + (Math.round(n * 100) / 100).toFixed(2);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const localMode = !(window.claude && window.claude.use);

  let stored = null, S = null, dirty = false;
  let ui = { deck: null, hsort: "color", view: "list", group: "type", sort: "n", dir: 1, tsort: "n", collapsed: {}, filter: "", pmin: "", pmax: "", scol: "" };
  let artifactApi = null, downloadsApi = null, assetsApi = null, canPublish = false, readOnly = false;
  let previewIdx = null;

  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  const deckOf = (id) => S.decks.find((d) => d.id === id);
  const count = (d) => d.cards.reduce((a, c) => a + c.q, 0);
  const value = (d) => d.cards.reduce((a, c) => a + c.q * c.p, 0);
  const meta = (n) => S.meta[n] || null;
  const isCmd = (d, n) => d.cmd.includes(n);
  // A plain card list (no commander, no 100-card target). Decks without `kind` are Commander.
  const isList = (d) => d.kind === "list";
  const KINDS = [["cmd", "Mazo de Commander"], ["list", "Lista de cartas"]];
  const kindRadios = (cur) => `<div class="kinds" role="radiogroup" aria-label="Tipo">${KINDS.map(([k, label]) =>
    `<label class="opt"><input type="radio" name="kind" value="${k}"${cur === k ? " checked" : ""}> ${label}</label>`).join("")}</div>`;
  const kindOf = (m) => m.querySelector('input[name="kind"]:checked').value;
  // Switching to a list drops the commander; switching back guesses it again from the deck name.
  // The commander becomes the list's cover card.
  function setKind(d, k) {
    if (k === "list") { if (!isList(d) && d.cmd.length) d.cover = d.cmd[0]; d.kind = "list"; d.cmd = []; }
    else { if (isList(d)) d.cmd = guessCommander(d.name, d.cards); delete d.kind; delete d.cover; delete d.colors; }
  }
  // Cards shown as the deck's thumbnail: its commander(s), or a list's cover card.
  const thumbNames = (d) => isList(d) ? (d.cover ? [d.cover] : []) : d.cmd;
  const sizePill = (d, n) => isList(d) ? `<span class="pill info num">${n} cartas</span>` : `<span class="pill ${n === 100 ? "ok" : "warn"} num">${n} / 100</span>`;

  function change() {
    dirty = true;
    lsSet(DRAFT_KEY, { base: stored.savedAt, data: S });
    if (localMode) lsSet(FILE_DIRTY_KEY, true);
    render();
  }

  // ---------- Card data ----------
  const TYPE_GROUPS = [
    ["Creature", "Criaturas"], ["Planeswalker", "Planeswalkers"], ["Battle", "Batallas"], ["Land", "Tierras"],
    ["Instant", "Instantáneos"], ["Sorcery", "Conjuros"], ["Artifact", "Artefactos"], ["Enchantment", "Encantamientos"],
  ];
  const COLOR_NAMES = { W: "Blanco", U: "Azul", B: "Negro", R: "Rojo", G: "Verde" };
  function typeGroup(n) {
    const m = meta(n);
    if (!m) return "Sin datos";
    const t = m.t.split(" // ")[0];
    const hit = TYPE_GROUPS.find(([k]) => t.includes(k));
    return hit ? hit[1] : "Otros";
  }
  function isLand(n) { return typeGroup(n) === "Tierras"; }
  function cmcOf(n) { const m = meta(n); return m ? m.cmc : 0; }
  function groupKey(d, c) {
    if (isCmd(d, c.n)) return "Comandante";
    if (ui.group === "type") return typeGroup(c.n);
    if (ui.group === "cmc") { if (isLand(c.n)) return "Tierras"; const v = Math.floor(cmcOf(c.n)); return v >= 7 ? "Coste 7+" : "Coste " + v; }
    if (ui.group === "color") {
      if (isLand(c.n)) return "Tierras";
      const m = meta(c.n); if (!m) return "Sin datos";
      const cols = (m.m.match(/[WUBRG]/g) || []).filter((x, i, a) => a.indexOf(x) === i);
      return cols.length === 0 ? "Incoloro" : cols.length > 1 ? "Multicolor" : COLOR_NAMES[cols[0]];
    }
    return "Cartas";
  }
  const GROUP_ORDER = ["Comandante", ...TYPE_GROUPS.map((x) => x[1]).filter((x) => x !== "Tierras"), "Blanco", "Azul", "Negro", "Rojo", "Verde", "Multicolor", "Incoloro",
    "Coste 0", "Coste 1", "Coste 2", "Coste 3", "Coste 4", "Coste 5", "Coste 6", "Coste 7+", "Cartas", "Otros", "Tierras", "Sin datos"];

  // Official mana symbols (Scryfall SVGs) embedded in the page; anything missing falls back to a drawn circle.
  const SYMS = (() => { try { return JSON.parse($("mana-syms").textContent) || {}; } catch (e) { return {}; } })();
  const symImg = (s, cls) => `<img class="${cls} sym" src="${SYMS[s]}" alt="${esc(s)}" draggable="false">`;
  function costHtml(cost) {
    if (!cost) return "";
    const syms = cost.match(/\{[^}]+\}/g) || [];
    return `<span class="cost" aria-label="Coste ${esc(cost)}">` + syms.map((s) => {
      if (SYMS[s]) return symImg(s, "ms");
      const x = s.slice(1, -1);
      const parts = x.split("/");
      const cols = parts.filter((p) => "WUBRG".includes(p));
      if (parts.length === 2 && cols.length) {
        const a = "WUBRG".includes(parts[0]) ? `var(--m${parts[0]})` : "var(--mC)";
        const b = "WUBRG".includes(parts[1]) ? `var(--m${parts[1]})` : "var(--mC)";
        const label = parts[1] === "P" ? "ϕ" : "";
        return `<span class="ms" style="background:linear-gradient(135deg, ${a} 50%, ${b} 50%)">${label}</span>`;
      }
      return `<span class="ms ${"WUBRG".includes(x) ? x : ""}">${"WUBRG".includes(x) ? "" : esc(x)}</span>`;
    }).join("") + "</span>";
  }
  // Back face image of a Scryfall card object (transform, modal DFC, reversible), or "" for single-image cards.
  const backOf = (sc) => { const f = sc.card_faces || []; return f.length > 1 && f[1].image_uris ? f[1].image_uris.normal : ""; };
  // Back face for a card in a deck: its own chosen printing's back, else the default one (only reachable where Scryfall is).
  function backImg(n, c) {
    if (c && c.imb) return c.imb;
    const m = meta(n);
    return localMode && m && m.b ? m.b : "";
  }
  // With flip set, double-faced cards get a button that turns the card over, like Scryfall's "Turn over".
  function artHtml(n, cls, c, flip) {
    const back = flip && backImg(n, c);
    if (back) return `<span class="flip"><span class="faces">${artHtml(n, cls, c)}<img class="art back" src="${esc(back)}" alt="${esc(n)} (reverso)" loading="lazy" decoding="async"></span>`
      + `<span class="flipbtn" role="button" tabindex="0" data-flip title="Dar la vuelta" aria-label="Dar la vuelta a la carta">${icon("flip")}</span></span>`;
    const m = meta(n);
    const alt = esc(n);
    if (c && c.im) return `<img class="art ${cls || ""}" src="${esc(c.im)}" alt="${alt}" loading="lazy" decoding="async">`;
    if (m && m.img && (localMode || !m.sp)) return `<img class="art ${cls || ""}" src="${esc(m.img)}" alt="${alt}" loading="lazy" decoding="async">`;
    if (m && m.sp) {
      const i = m.sp[1], col = i % SPRITE.cols, row = Math.floor(i / SPRITE.cols);
      return `<div class="art ${cls || ""}" role="img" aria-label="${alt}" style="background-image:url(img/s${m.sp[0]}.jpg);background-size:${SPRITE.cols * 100}% ${SPRITE.rows * 100}%;background-position:${(col * 100) / (SPRITE.cols - 1)}% ${(row * 100) / (SPRITE.rows - 1)}%"></div>`;
    }
    return `<div class="art ph ${cls || ""}"><b>${alt}</b><span>${m ? esc(m.t) : "Sin imagen"}</span>${m ? costHtml(m.m) : ""}</div>`;
  }
  // StarCityGames search for the card (front face name for double-faced cards).
  const scgUrl = (n) => "https://starcitygames.com/search/?search_query=" + encodeURIComponent(n.split(" // ")[0]);
  // A printing from the Scryfall API as the card fields it sets: edition, price (foil-aware), image and link.
  function printData(sc, foil) {

  // Fills card data for names we don't know yet (works where Scryfall is reachable, e.g. the local file).

  }

  // ---------- CSV ----------
  function parseCsv(text) {

    if (!lines.length) return [];
    const sep = lines[0].includes("\t") ? "\t" : ",";
    const head = lines[0].split(sep).map((h) => h.trim().toLowerCase());
    const col = (names, fb) => { const i = head.findIndex((h) => names.includes(h)); return i < 0 ? fb : i; };
    const iq = col(["quantityx", "quantity", "qty", "cantidad"], 0), inn = col(["name", "nombre"], 1),
      ie = col(["edition", "set", "edicion", "edición"], 2), iff = col(["foil"], 3), ip = col(["price", "precio"], 4);

    return lines.slice(hasHead ? 1 : 0).map((l) => {
      const f = l.split(sep);

      if (!name) return null;
      return { q: Math.max(1, parseInt(f[iq], 10) || 1), n: name, e: (f[ie] || "").trim(), f: /foil/i.test(f[iff] || ""),

          (m, close) => {
            const inp = m.querySelector("#nameInput"), one = () => single || m.querySelector('input[value="one"]').checked;
            m.querySelectorAll('input[name="imode"]').forEach((r) => r.onchange = () => { inp.disabled = !one(); });

  // One deck per name: files sharing a name are combined instead of the last one winning.

  // A card's color identity (Commander rules: cost and rules text), or with byCost just the color of its mana cost.

  function pipsHtml(ci) {

  let menuOpen = false;
  function renderSide() {

  function renderHome() {

  const SETS = (() => { try { return JSON.parse($("set-codes").textContent) || {}; } catch (e) { return {}; } })();

      const x = printingOf(c);
      if (x && !x[1]) want.set(norm(front(c.n)) + "|" + x[0], { name: front(c.n), set: x[0].toLowerCase() });
    }

    for (let i = 0; i < ids.length; i += 75) chunks.push(ids.slice(i, i + 75));

    if (t.id === "fitsBtn") return fitsModal(d);
    if (t.id === "dupBtn") return askName("Duplicar mazo", d.name + " (copia)", "Duplicar", (name) => { const nd = JSON.parse(JSON.stringify(d)); nd.id = uid(); nd.name = name; S.decks.push(nd); ui.deck = nd.id; change(); });
    if (t.id === "delDeckBtn") return confirmBox("Eliminar mazo", `Se eliminará “${d.name}” con sus ${count(d)} cartas.`, "Eliminar", () => { S.decks = S.decks.filter((x) => x !== d); ui.deck = null; change(); });
    const row = t.closest("tr[data-i]");
    if (!row) return;
    const c = d.cards[+row.dataset.i];
    const act = t.dataset.act;
    if (act === "inc") { c.q++; change(); }
    else if (act === "dec") { if (c.q > 1) { c.q--; change(); } else confirmBox("Quitar carta", `¿Quitar ${c.n} del mazo?`, "Quitar", () => { d.cards.splice(d.cards.indexOf(c), 1); change(); }); }
    else if (act === "foil") { c.f = !c.f; change(); }
    else if (act === "del") { d.cards.splice(d.cards.indexOf(c), 1); d.cmd = d.cmd.filter((x) => x !== c.n); change(); toast(`${c.n} eliminada`); }
  });
  app.addEventListener("mouseover", (e) => {
    const r = e.target.closest(".row[data-card]");
    const p = $("preview");
    if (!r || !p || +r.dataset.card === previewIdx) return;
    previewIdx = +r.dataset.card;
    p.innerHTML = previewHtml(deckOf(ui.deck));
    app.querySelectorAll(".row.sel").forEach((x) => x.classList.remove("sel"));
    r.classList.add("sel");
  });
  app.addEventListener("keydown", (e) => {
    const r = e.target.closest && e.target.closest("[data-ok], [data-flip], .row[data-card]");
    if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); r.click(); }
  });
  app.addEventListener("change", (e) => {
    const t = e.target, d = deckOf(ui.deck);
    if (t.id === "file") { importFiles(t.files); t.value = ""; return; }
    if (!d) return;
    const row = t.closest("tr[data-i]");
    if (row && t.dataset.field) {
      const c = d.cards[+row.dataset.i];
      if (t.dataset.field === "p") c.p = parseFloat(t.value.replace(/[^0-9.]/g, "")) || 0;
      else c.e = t.value.trim();
      change();
    }
  });
  app.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "q") { ui.filter = t.value; render(); }
    // Resize in place instead of re-rendering, so dragging stays smooth.
    if (t.id === "cardSize") { ui.cardW = +t.value; document.querySelector(".board").style.setProperty("--cw", ui.cardW + "px"); const { filter, pmin, pmax, scol, ...keep } = ui; lsSet(UI_KEY, keep); }
    if (t.id === "deckFilter") {
      const d = deckOf(ui.deck); d.localFilter = t.value;
      const pos = t.selectionStart; render();
      const nf = $("deckFilter"); nf.focus(); nf.setSelectionRange(pos, pos);
    }
    if (t.id === "pMin" || t.id === "pMax") {
      ui[t.id === "pMin" ? "pmin" : "pmax"] = t.value;
      const pos = t.selectionStart; render();
      const nf = $(t.id); nf.focus(); nf.setSelectionRange(pos, pos);
    }
  });
  app.addEventListener("submit", (e) => {
    if (e.target.id !== "addForm") return;
    e.preventDefault();
    const d = deckOf(ui.deck); if (!d) return;
    const name = $("addN").value.trim(); if (!name) return;
    const card = { q: Math.max(1, parseInt($("addQ").value, 10) || 1), n: name, e: $("addE").value.trim(), f: $("addF").checked, p: parseFloat($("addP").value.replace(/[^0-9.]/g, "")) || 0 };
    // From a Scryfall link (and the name wasn't changed after): keep its image, link and card data.
    const x = addPrint && norm(addPrint.n) === norm(name) ? addPrint : null;
    if (x) {
      if (!S.meta[x.n]) S.meta[x.n] = x.meta;
      card.su = x.su; if (x.im) card.im = x.im; if (x.imb) card.imb = x.imb;
    }
    const same = d.cards.find((c) => c.n.toLowerCase() === name.toLowerCase() && c.e === card.e && c.f === card.f);
    if (same) same.q += card.q; else d.cards.push(card);
    change(); lookupMissing();
    toast(`${name} agregada a ${d.name}`);
    addPrint = null;
    ["addS", "addN", "addE", "addP"].forEach((k) => { $(k).value = ""; });
    $("addMsg").textContent = "Pega el enlace de la impresión exacta y pulsa Cargar: llena el nombre, la edición, el precio y la imagen.";
    $("addN").focus();
  });
  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => { if (![...(e.dataTransfer.types || [])].includes("Files")) return; e.preventDefault(); if (dragDepth++ === 0) { const x = document.createElement("div"); x.className = "drop"; x.id = "dropzone"; x.textContent = $("addForm") ? "Suelta tus CSV para agregarlos a este mazo" : "Suelta tus CSV para importarlos"; document.body.appendChild(x); } });
  window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; const z = $("dropzone"); if (z) z.remove(); } });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; const z = $("dropzone"); if (z) z.remove(); if (e.dataTransfer.files.length && !$("imgModal")) ($("addForm") ? appendCsv : importFiles)(e.dataTransfer.files); });
  document.addEventListener("click", (e) => {
    // The menu re-renders on click, so a click that started inside it may come from a node that is gone now.
    if (menuOpen && e.target.isConnected && !$("decklist").contains(e.target)) { menuOpen = false; renderSide(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && menuOpen) { menuOpen = false; renderSide(); $("dmBtn").focus(); }
    if (e.key === "Escape") $("overlay").innerHTML = "";
    if ((e.ctrlKey || e.metaKey) && e.key === "s" && (localMode || (canPublish && dirty))) { e.preventDefault(); save(); }
  });

  // Theme: light or dark, remembered per browser. Without a saved choice, start from the system's.
  const THEME_KEY = "boveda-mazos-theme";
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    const b = $("themeBtn"), label = t === "dark" ? "Cambiar a tema claro" : "Cambiar a tema oscuro";
    b.innerHTML = icon(t === "dark" ? "sun" : "moon");
    b.title = label; b.setAttribute("aria-label", label);
  }
  let theme = lsGet(THEME_KEY);
  if (theme !== "dark" && theme !== "light") {
    const host = document.documentElement.getAttribute("data-theme");
    theme = host === "dark" || host === "light" ? host
      : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  applyTheme(theme);
  $("importBtn").innerHTML = icon("import");
  $("newBtn").innerHTML = icon("newdeck");
  $("saveBtn").innerHTML = icon("save") + "Guardar";
  $("backupBtn").innerHTML = icon("backup") + "Respaldo";
  $("themeBtn").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    lsSet(THEME_KEY, theme);
    applyTheme(theme);
  });

  // Keep the sticky card preview just below the (now taller) top bar.
  const topBar = document.querySelector(".top");
  const syncTop = () => document.documentElement.style.setProperty("--top-h", topBar.offsetHeight + "px");
  if (window.ResizeObserver) new ResizeObserver(syncTop).observe(topBar);
  syncTop();

  // ---------- Start ----------
  function start(data) {
    stored = { savedAt: data.savedAt };
    S = data;
    const draft = lsGet(DRAFT_KEY);
    if (draft && draft.base === data.savedAt && draft.data) { S = draft.data; dirty = true; }
    S.meta = S.meta || {};
    // A draft keeps its own copy of the card data; bring in back faces added to the page after the draft was made.
    for (const n in data.meta || {}) if (data.meta[n].b && S.meta[n] && !S.meta[n].b) S.meta[n].b = data.meta[n].b;
    S.decks.forEach((d) => { if (!d.cmd) d.cmd = d.commander ? [d.commander] : []; delete d.commander; });
    const savedUi = lsGet(UI_KEY);
    if (savedUi) ui = Object.assign(ui, savedUi, { filter: "", pmin: "", pmax: "", scol: "" });
    ui.deck = null; // always open on the main page
    render();
    if (localMode) lookupMissing();
  }
  const embedded = JSON.parse($("deck-data").textContent);
  if (embedded) start(embedded);
  else fetch("decks.json", { cache: "no-store" }).then((r) => r.json()).then(start, () => {
    $("view").innerHTML = `<div class="deckhead empty">No se pudieron cargar los mazos. Recarga la página.</div>`;
  });

  if (!localMode) {
    window.claude.use("artifact").then((a) => { if (a) { artifactApi = a; canPublish = true; } else readOnly = true; if (S) renderStatus(); });
    window.claude.use("downloads").then((dl) => { downloadsApi = dl; });
    window.claude.use("assets").then((a) => { assetsApi = a; });
  }
})();
</script>
